<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c9232c">
<meta name="description" content="The Underground Library — una citazione letteraria per il tuo viaggio.">
<title>The Underground Library</title>
<style>
:root{--red:#c9232c;--red-dark:#a91c24;--ink:#201d1b;--paper:#fffdf9;--canvas:#eee9e1;--muted:#746e68;--rule:#e2ddd5}
*{box-sizing:border-box}html{min-height:100%;background:var(--canvas)}body{margin:0;min-height:100vh;min-height:100svh;padding:clamp(16px,4vw,52px);font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 12%,rgba(201,35,44,.08) 0 2px,transparent 3px),var(--canvas)}
.page{position:relative;width:100%;height:calc(100svh - clamp(32px,8vw,104px));max-width:960px;min-height:0;margin:auto;background:var(--paper);border-top:7px solid var(--red);box-shadow:0 24px 70px rgba(44,34,27,.11);display:flex;flex-direction:column;padding:clamp(28px,6.5vw,76px);overflow:hidden}
.topline{display:flex;align-items:flex-start;justify-content:flex-start;gap:24px;border-bottom:1px solid var(--rule);padding-bottom:22px}.brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%}.city{color:var(--ink);font-size:.78rem;font-weight:800;letter-spacing:.12em}.mark{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.stamp{color:var(--red-dark);font-size:.72rem;font-weight:400;letter-spacing:.035em;line-height:1.55;text-align:left;text-transform:none;max-width:480px;margin-top:8px}
main{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding:clamp(52px,8vh,82px) 0 90px}.quote{max-height:clamp(250px,42vh,450px);overflow:hidden;display:block;margin:0;max-width:780px}.quote-copy{display:block;width:100%;font-family:Georgia,'Times New Roman',serif;font-size:clamp(2.35rem,6.3vw,5.25rem);line-height:1.08;letter-spacing:-.045em}.quote-copy::before{content:'“';color:var(--red);font-size:1em;line-height:inherit;vertical-align:baseline}.quote-copy::after{content:'”';color:var(--red)}
.attribution{margin-top:24px;padding:15px 20px;border-left:3px solid var(--red);background:#f7f3ed;max-width:max-content}.book{font-family:Georgia,'Times New Roman',serif;font-size:1.12rem;font-style:italic;margin:0 0 6px}.author{color:var(--muted);font-size:.9rem;margin:0}.action{position:absolute;left:0;bottom:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.button{appearance:none;border:0;border-radius:2px;background:var(--red);color:#fff;min-height:54px;padding:0 22px;font-size:.75rem;font-weight:800;letter-spacing:.1em;cursor:pointer;box-shadow:0 5px 12px rgba(201,35,44,.16);transition:background .2s,transform .2s,box-shadow .2s}.button span{display:inline-block;margin-left:12px;font-size:1rem}.button:hover{background:var(--red-dark);transform:translateY(-2px);box-shadow:0 8px 16px rgba(201,35,44,.2)}.button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
footer{border-top:1px solid var(--rule);padding-top:17px;color:var(--muted);font-size:.7rem;line-height:1.55;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.footer-title{color:var(--ink);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:560px){body{padding:0;background:var(--paper)}.page{height:100svh;min-height:100svh;padding:25px 23px 20px;border-top-width:6px;box-shadow:none}.topline{align-items:flex-start;gap:14px;padding-bottom:18px}.mark,.city{font-size:.66rem;letter-spacing:.09em}.stamp{max-width:100%;font-size:.65rem;line-height:1.5;margin-top:7px}main{padding:clamp(52px,9vh,78px) 0 88px}.quote{max-height:clamp(230px,37svh,330px)}.quote-copy{font-size:clamp(2.35rem,10vw,3.45rem);line-height:1.08}.attribution{margin-top:24px;padding:13px 16px}.book{font-size:1.04rem}.author{font-size:.86rem}.action{right:0}.button{width:100%;min-height:56px}footer{font-size:.65rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
<header class="topline"><div class="brand"><div class="city">NEW YORK</div><div class="mark">The Underground Library</div><div class="stamp">La città corre.<br>Fermati un momento: lascia che siano le parole a portarti lontano.</div></div></header>
<main aria-live="polite" aria-atomic="true">
<blockquote class="quote"><span class="quote-copy" id="quote">Non tutti quelli che vagano sono perduti.</span></blockquote>
<div class="attribution"><p class="book" id="book">Il Signore degli Anelli</p><p class="author" id="author">J.R.R. Tolkien</p></div>
<div class="action"><button class="button" id="next" type="button">UN'ALTRA CITAZIONE <span aria-hidden="true">↗</span></button></div>
</main>
<footer><span class="footer-title">Leggi. Viaggia. Immagina.</span><span>Progetto indipendente, non affiliato a NYPL o MTA.</span></footer>
</div>
<script>
const quotes = [
 {text:'Non tutti quelli che vagano sono perduti.',book:'Il Signore degli Anelli',author:'J.R.R. Tolkien'},
 {text:'Le cose non si vedono bene che col cuore.',book:'Il piccolo principe',author:'Antoine de Saint-Exupéry'},
 {text:'È il tempo che hai perduto per la tua rosa che ha fatto la tua rosa così importante.',book:'Il piccolo principe',author:'Antoine de Saint-Exupéry'},
 {text:'Le strade si fanno andando.',book:'Proverbios y cantares',author:'Antonio Machado'},
 {text:'Siamo fatti della stessa sostanza dei sogni.',book:'La tempesta',author:'William Shakespeare'},
 {text:'Tutte le famiglie felici si somigliano; ogni famiglia infelice è infelice a modo suo.',book:'Anna Karenina',author:'Lev Tolstoj'},
 {text:"Amare non è guardarsi l'un l'altro, ma guardare insieme nella stessa direzione.",book:'Terra degli uomini',author:'Antoine de Saint-Exupéry'},
 {text:"L'essenziale è invisibile agli occhi.",book:'Il piccolo principe',author:'Antoine de Saint-Exupéry'},
 {text:'Il cuore ha le sue ragioni che la ragione non conosce.',book:'Pensieri',author:'Blaise Pascal'},
 {text:'La bellezza salverà il mondo.',book:'L’idiota',author:'Fëdor Dostoevskij'},
 {text:'L’inferno dei viventi non è qualcosa che sarà; se ce n’è uno, è quello che è già qui.',book:'Le città invisibili',author:'Italo Calvino'},
 {text:'La vita è sogno.',book:'La vita è sogno',author:'Pedro Calderón de la Barca'},
 {text:'Dopo tutto, domani è un altro giorno.',book:'Via col vento',author:'Margaret Mitchell'},
 {text:'Il coraggio, uno non se lo può dare.',book:'I promessi sposi',author:'Alessandro Manzoni'},
 {text:'Se vogliamo che tutto rimanga com’è, bisogna che tutto cambi.',book:'Il Gattopardo',author:'Giuseppe Tomasi di Lampedusa'},
 {text:'Prendete la vita con leggerezza, che leggerezza non è superficialità, ma planare sulle cose dall’alto, non avere macigni sul cuore.',book:'Lezioni americane',author:'Italo Calvino'},
 {text:'Non capisco come si possa passare dinanzi a un albero, e non esser felice di vederlo.',book:'L’idiota',author:'Fëdor Dostoevskij'}
];
let current = -1;
let remaining = [];
const quoteEl=document.getElementById('quote'), bookEl=document.getElementById('book'), authorEl=document.getElementById('author');
function fitQuoteText(){quoteEl.style.fontSize='';let size=parseFloat(getComputedStyle(quoteEl).fontSize);const area=quoteEl.parentElement;while(area.scrollHeight>area.clientHeight+1&&size>16){size-=1;quoteEl.style.fontSize=`${size}px`;}}
function showQuote(index){const q=quotes[index];quoteEl.textContent=q.text;bookEl.textContent=q.book;authorEl.textContent=q.author;fitQuoteText();}
function shuffleQuotes(){remaining=quotes.map((_,index)=>index);for(let i=remaining.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[remaining[i],remaining[j]]=[remaining[j],remaining[i]];}if(remaining.length>1&&remaining[remaining.length-1]===current){[remaining[0],remaining[remaining.length-1]]=[remaining[remaining.length-1],remaining[0]];}}
function showNextQuote(){if(remaining.length===0)shuffleQuotes();current=remaining.pop();showQuote(current);}
document.getElementById('next').addEventListener('click',showNextQuote);
showNextQuote();
window.addEventListener('resize',fitQuoteText);
</script>
</body>
</html>
